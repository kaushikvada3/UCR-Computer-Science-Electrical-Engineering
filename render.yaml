services:
  - type: web
    name: bms-collaborative-deck
    runtime: node
    plan: starter
    rootDir: EE175 - Senior Design/Final Presentation
    buildCommand: npm install && npm --prefix server install && npm --prefix app install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PERSIST_ROOT
        value: /var/data
    disk:
      name: bms-collab-persist
      mountPath: /var/data
      sizeGB: 5
