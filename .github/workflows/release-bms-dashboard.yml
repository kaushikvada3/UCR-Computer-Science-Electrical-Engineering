name: Release BMS Dashboard (Monorepo)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  APP_DIR: EE175 - Senior Design/BMS_Dashboard

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
      WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            EE175 - Senior Design/BMS_Dashboard
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          cd "${env:APP_DIR}"
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Windows installer
        shell: pwsh
        run: |
          cd "${env:APP_DIR}"
          $version = "${env:GITHUB_REF_NAME}".TrimStart('v')
          powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1 -Version $version

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: ${{ env.APP_DIR }}/dist/release/windows-x64/*

  build-macos:
    runs-on: macos-14
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            EE175 - Senior Design/BMS_Dashboard
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd "${APP_DIR}"
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install signing certificate
        if: ${{ env.APPLE_CERT_P12_BASE64 != '' && env.APPLE_CERT_PASSWORD != '' }}
        run: |
          echo "${APPLE_CERT_P12_BASE64}" | base64 --decode > /tmp/bms_cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/bms_cert.p12 -k build.keychain -P "${APPLE_CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          IDENTITY="$(security find-identity -v -p codesigning build.keychain | head -n 1 | awk -F'\"' '{print $2}')"
          echo "APPLE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build macOS DMG
        env:
          APPLE_SIGN_IDENTITY: ${{ env.APPLE_SIGN_IDENTITY }}
        run: |
          cd "${APP_DIR}"
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh "${GITHUB_REF_NAME#v}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: ${{ env.APP_DIR }}/dist/release/macos-universal2/*

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            EE175 - Senior Design/BMS_Dashboard
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2 gpg patchelf desktop-file-utils libglib2.0-bin libxkbcommon-x11-0 libegl1 libgl1
          cd "${APP_DIR}"
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build Linux AppImage
        run: |
          cd "${APP_DIR}"
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh "${GITHUB_REF_NAME#v}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: ${{ env.APP_DIR }}/dist/release/linux-x64/*

  publish-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            EE175 - Senior Design/BMS_Dashboard
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare signatures and manifest
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          WINDOWS_SRC="$(find release-artifacts/windows-release -type f -name 'BMSDashboard-windows-x64-setup.exe' | head -n1 || true)"
          MACOS_SRC="$(find release-artifacts/macos-release -type f -name 'BMSDashboard-macos-universal2.dmg' | head -n1 || true)"
          LINUX_SRC="$(find release-artifacts/linux-release -type f -name 'BMSDashboard-linux-x64.AppImage' | head -n1 || true)"

          if [[ -z "${WINDOWS_SRC}" ]]; then
            WINDOWS_SRC="$(find release-artifacts/windows-release -type f -name '*windows-x64-setup.exe' | head -n1 || true)"
          fi
          if [[ -z "${MACOS_SRC}" ]]; then
            MACOS_SRC="$(find release-artifacts/macos-release -type f -name '*.dmg' | head -n1 || true)"
          fi
          if [[ -z "${LINUX_SRC}" ]]; then
            LINUX_SRC="$(find release-artifacts/linux-release -type f -name '*.AppImage' | head -n1 || true)"
          fi

          if [[ -z "${WINDOWS_SRC}" || -z "${MACOS_SRC}" || -z "${LINUX_SRC}" ]]; then
            echo "Missing one or more build artifacts."
            ls -R release-artifacts || true
            exit 1
          fi

          UPLOAD_DIR="release-artifacts/upload"
          mkdir -p "${UPLOAD_DIR}"

          WINDOWS_FILE="${UPLOAD_DIR}/BMSDashboard-windows-x64-setup.exe"
          MACOS_FILE="${UPLOAD_DIR}/BMSDashboard-macos-universal2.dmg"
          LINUX_FILE="${UPLOAD_DIR}/BMSDashboard-linux-x64.AppImage"

          cp -f "${WINDOWS_SRC}" "${WINDOWS_FILE}"
          cp -f "${MACOS_SRC}" "${MACOS_FILE}"
          cp -f "${LINUX_SRC}" "${LINUX_FILE}"

          WIN_SIG=""
          MAC_SIG=""
          LINUX_SIG=""
          if [[ -n "${LINUX_GPG_PRIVATE_KEY}" && -n "${LINUX_GPG_PASSPHRASE}" ]]; then
            echo "${LINUX_GPG_PRIVATE_KEY}" | gpg --batch --import
            KEY_ID="$(gpg --list-secret-keys --keyid-format LONG | awk '/^sec/{print $2}' | head -n1 | sed 's#.*\/##')"
            if [[ -n "${KEY_ID}" ]]; then
              WIN_SIG="${WINDOWS_FILE}.sig"
              MAC_SIG="${MACOS_FILE}.sig"
              LINUX_SIG="${LINUX_FILE}.sig"
              gpg --batch --yes --pinentry-mode loopback --passphrase "${LINUX_GPG_PASSPHRASE}" --local-user "${KEY_ID}" --output "${WIN_SIG}" --detach-sign "${WINDOWS_FILE}"
              gpg --batch --yes --pinentry-mode loopback --passphrase "${LINUX_GPG_PASSPHRASE}" --local-user "${KEY_ID}" --output "${MAC_SIG}" --detach-sign "${MACOS_FILE}"
              gpg --batch --yes --pinentry-mode loopback --passphrase "${LINUX_GPG_PASSPHRASE}" --local-user "${KEY_ID}" --output "${LINUX_SIG}" --detach-sign "${LINUX_FILE}"
            fi
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          ARGS=(
            --output release-artifacts/release-manifest.json
            --version "${VERSION}"
            --channel stable
            --repo "${GITHUB_REPOSITORY}"
            --tag "${GITHUB_REF_NAME}"
            --windows-file "${WINDOWS_FILE}"
            --macos-file "${MACOS_FILE}"
            --linux-file "${LINUX_FILE}"
          )
          if [[ -n "${WIN_SIG}" ]]; then
            ARGS+=(--windows-signature "${WIN_SIG}")
          fi
          if [[ -n "${MAC_SIG}" ]]; then
            ARGS+=(--macos-signature "${MAC_SIG}")
          fi
          if [[ -n "${LINUX_SIG}" ]]; then
            ARGS+=(--linux-signature "${LINUX_SIG}")
          fi

          python "${APP_DIR}/scripts/build_release_manifest.py" "${ARGS[@]}"
          cp -f release-artifacts/release-manifest.json "${UPLOAD_DIR}/"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/upload/*
