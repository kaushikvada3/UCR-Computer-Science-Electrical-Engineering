<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 4: The Miss Chain</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            margin: 0;
            background-color: #000;
            font-family: 'Orbitron', sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #sim-container {
            position: relative;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 80px rgba(0, 255, 100, 0.1);
        }

        canvas {
            display: block;
            background: #020205;
        }

        /* --- Header Bar --- */
        #header-bar {
            background: #111;
            width: 100%;
            padding: 15px 0;
            display: flex;
            justify-content: center;
            border-bottom: 2px solid #333;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ccc;
        }

        /* --- UI Controls --- */
        .controls {
            display: flex;
            flex-direction: column;
            background: #111;
            border-top: 4px solid #333;
            width: 100%;
        }

        .control-row {
            display: flex;
            width: 100%;
        }

        button.action-btn {
            flex: 1;
            padding: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            border: none;
            border-right: 1px solid #222;
            border-bottom: 1px solid #222;
            cursor: pointer;
            background: #0a0a0a;
            color: #666;
            transition: all 0.2s;
        }

        button.action-btn:hover:not(:disabled) {
            background: #1a1a1a;
            color: #fff;
        }

        button.action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            background: #050505;
        }

        /* Scenario Buttons */
        .btn-l1 {
            border-bottom: 4px solid #00ffff !important;
        }

        .btn-l2 {
            border-bottom: 4px solid #ffee00 !important;
        }

        .btn-l3 {
            border-bottom: 4px solid #ffaa00 !important;
        }

        .btn-ram {
            border-bottom: 4px solid #ff0044 !important;
        }

        .btn-l1:hover:not(:disabled) {
            color: #00ffff;
            box-shadow: inset 0 -10px 20px rgba(0, 255, 255, 0.2);
        }

        .btn-l2:hover:not(:disabled) {
            color: #ffee00;
            box-shadow: inset 0 -10px 20px rgba(255, 238, 0, 0.2);
        }

        .btn-l3:hover:not(:disabled) {
            color: #ffaa00;
            box-shadow: inset 0 -10px 20px rgba(255, 170, 0, 0.2);
        }

        .btn-ram:hover:not(:disabled) {
            color: #ff0044;
            box-shadow: inset 0 -10px 20px rgba(255, 0, 68, 0.2);
        }

        /* Step Controls */
        #step-controls {
            background: #1f1f1f;
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        #next-btn {
            background: #00ff88;
            color: #000;
            padding: 15px 40px;
            border-radius: 4px;
            font-size: 16px;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        #next-btn:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 20px;
            font-size: 14px;
            color: #888;
        }

        input[type="checkbox"] {
            transform: scale(1.5);
            accent-color: #00ff88;
        }

        /* Recorder Button */
        #rec-btn {
            background: #200;
            color: #f44;
            max-width: 150px;
        }

        #rec-btn.recording {
            background: #f00;
            color: #fff;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>

<body>

    <div id="sim-container">
        <div id="header-bar">
            PHASE 4: FULL SCALE SIMULATION
        </div>

        <canvas id="simCanvas" width="1280" height="550"></canvas>

        <div class="controls">
            <!-- Mode & Stepper -->
            <div id="step-controls">
                <div class="toggle-container">
                    <input type="checkbox" id="autoplay-check" onchange="toggleAutoPlay()">
                    <label for="autoplay-check">AUTO-PLAY MODE</label>
                </div>
                <button id="next-btn" class="action-btn" onclick="nextStep()" disabled>▶ NEXT STEP</button>
                <div style="flex:1"></div>
                <button id="rec-btn" class="action-btn" onclick="toggleRecord()">● REC</button>
                <button id="reset-btn" class="action-btn" onclick="resetSim()">RESET</button>
            </div>

            <!-- Scenarios -->
            <div class="control-row">
                <button id="btn-hit-l1" class="action-btn btn-l1" onclick="startScenario('L1')">SCENARIO: L1
                    HIT</button>
                <button id="btn-hit-l2" class="action-btn btn-l2" onclick="startScenario('L2')">SCENARIO: L2
                    HIT</button>
                <button id="btn-hit-l3" class="action-btn btn-l3" onclick="startScenario('L3')">SCENARIO: L3
                    HIT</button>
                <button id="btn-hit-ram" class="action-btn btn-ram" onclick="startScenario('RAM')">SCENARIO: RAM
                    HIT</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const nextBtn = document.getElementById('next-btn');
        const autoplayCheck = document.getElementById('autoplay-check');
        const scenarioBtns = document.querySelectorAll('.control-row .action-btn');

        // --- Config ---
        const COLORS = {
            CPU: '#ffffff',
            L1: '#00ffff', // Cyan
            L2: '#ffee00', // Yellow
            L3: '#ffaa00', // Orange
            RAM: '#ff0044', // Red
            WIRE: '#1a1a1a',
            GRID: '#0a0a0a',
            HIT: '#00ff88',
            MISS: '#ff0044',
            HIGHLIGHT: '#ffffff'
        };

        const NODES = {
            CPU: { x: 100, y: 275, w: 90, h: 90, label: "CPU CORE" },
            L1: { x: 300, y: 275, w: 70, h: 110, label: "L1" },
            L2: { x: 550, y: 275, w: 70, h: 150, label: "L2" },
            L3: { x: 800, y: 275, w: 70, h: 200, label: "L3 (Shared)" },
            RAM: { x: 1200, y: 275, w: 120, h: 250, label: "RAM" }
        };

        // --- State ---
        let packets = [];
        let particles = [];
        let running = false;
        let autoPlay = false;

        // Scenario State
        let currentSteps = [];
        let stepIndex = 0;
        let waitingForStep = false;

        let statusText = "SYSTEM READY";
        let subText = "Select a scenario to begin";
        let nodeStatus = { L1: 'IDLE', L2: 'IDLE', L3: 'IDLE', RAM: 'IDLE' }; // IDLE, SCAN, MISS, HIT
        let activeNode = null;

        // --- Animation Loop ---
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function update() {
            // Check packet arrival
            // We only process logic when packets arrive or timers fire, handled by callbacks.

            // Move Packets
            for (let i = packets.length - 1; i >= 0; i--) {
                let p = packets[i];
                p.progress += p.speed;

                // Trails
                if (Math.random() > 0.3) {
                    particles.push({
                        x: p.startX + (p.endX - p.startX) * p.progress,
                        y: p.y + (Math.random() - 0.5) * 15,
                        color: p.color,
                        life: 1.0,
                        vx: (Math.random() - 0.5), vy: (Math.random() - 0.5)
                    });
                }

                if (p.progress >= 1) {
                    p.onComplete();
                    packets.splice(i, 1);
                }
            }

            // Particles Logic
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Auto-Play Logic check
            if (running && waitingForStep && autoPlay) {
                // If waiting and autoplay is on, trigger next step instantly (or with delay)
                // For smoother visual, we might want a tiny delay, but handling via setTimeout in the step logic is easier.
            }
        }

        function draw() {
            ctx.fillStyle = "#020205";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGrid();
            drawChipBoundary();
            drawWires();
            drawScenarioHUD();

            for (let key in NODES) {
                drawNode(key, NODES[key]);
            }

            // Packets
            packets.forEach(p => {
                let cx = p.startX + (p.endX - p.startX) * p.progress;
                ctx.shadowBlur = 20;
                ctx.shadowColor = p.color;
                ctx.fillStyle = "#fff";
                ctx.fillRect(cx - 10, p.y - 10, 20, 20);
                ctx.fillStyle = p.color;
                ctx.fillRect(cx - 6, p.y - 6, 12, 12);
                ctx.shadowBlur = 0;
            });

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.globalAlpha = 1.0;
            });
        }

        // --- Drawing Helpers ---

        function drawGrid() {
            ctx.strokeStyle = COLORS.GRID;
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = 0; x < canvas.width; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
            for (let y = 0; y < canvas.height; y += 40) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
            ctx.stroke();
        }

        function drawChipBoundary() {
            const chipX = 40;
            const chipY = 120;
            const chipW = 860;
            const chipH = 270;

            ctx.strokeStyle = "rgba(0, 255, 255, 0.3)";
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 5]);
            ctx.strokeRect(chipX, chipY, chipW, chipH);
            ctx.setLineDash([]);

            ctx.fillStyle = "rgba(0, 255, 255, 0.02)";
            ctx.fillRect(chipX, chipY, chipW, chipH);

            ctx.fillStyle = "rgba(0, 255, 255, 0.8)";
            ctx.font = "bold 20px Orbitron";
            ctx.textAlign = "left";
            ctx.fillText("PROCESSOR CHIP", chipX + 20, chipY + 30);

            ctx.font = "12px Orbitron";
            ctx.fillStyle = "rgba(0, 255, 255, 0.5)";
            ctx.fillText("INTERNAL BUS SPEED: HIGH", chipX + 20, chipY + 50);

            // RAM Box
            const memX = 1100;
            const memY = 80;
            const memW = 200;
            const memH = 330;

            ctx.strokeStyle = "rgba(255, 0, 68, 0.3)";
            ctx.setLineDash([10, 5]);
            ctx.strokeRect(memX, memY, memW, memH);
            ctx.setLineDash([]);

            ctx.fillStyle = "rgba(255, 0, 68, 0.6)";
            ctx.textAlign = "center";
            ctx.font = "bold 16px Orbitron";
            ctx.fillText("OFF-CHIP MEMORY", memX + memW / 2, memY + 25);
        }

        function drawWires() {
            ctx.strokeStyle = COLORS.WIRE;
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.moveTo(NODES.CPU.x, 275);
            ctx.lineTo(NODES.RAM.x, 275);
            ctx.stroke();

            // Active Path Highlight
            if (activeNode) {
                ctx.strokeStyle = COLORS.HIGHLIGHT;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(NODES.CPU.x, 275);
                ctx.lineTo(NODES[activeNode].x, 275);
                ctx.stroke();
            }
        }

        function drawNode(key, n) {
            let color = COLORS[key];
            let status = nodeStatus[key];

            // Override color based on status
            if (status === 'MISS') color = COLORS.MISS;
            if (status === 'HIT') color = COLORS.HIT;
            if (status === 'SCAN') color = '#ffffff';

            ctx.strokeStyle = color;
            ctx.lineWidth = (activeNode === key) ? 4 : 2;
            ctx.fillStyle = "#080808";

            // Glow if active
            if (status === 'SCAN' || status === 'HIT' || status === 'MISS') {
                ctx.shadowBlur = 20;
                ctx.shadowColor = color;
            }

            ctx.beginPath();
            ctx.rect(n.x - n.w / 2, n.y - n.h / 2, n.w, n.h);
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Label
            ctx.fillStyle = (activeNode === key) ? "#fff" : "#555";
            ctx.font = "bold 18px Orbitron";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(n.label, n.x, n.y - n.h / 2 - 25);

            // Status Text Overlay
            if (status && status !== 'IDLE') {
                ctx.fillStyle = color;
                ctx.font = "bold 16px Orbitron";
                ctx.fillText(status, n.x, n.y);
            }
        }

        function drawScenarioHUD() {
            ctx.fillStyle = "#fff";
            ctx.font = "30px Orbitron";
            ctx.textAlign = "left";
            ctx.fillText(statusText, 50, 60);

            let subColor = "#888";
            if (waitingForStep && !autoPlay) subColor = "#00ff88"; // Highlight "waiting" instruction

            ctx.fillStyle = subColor;
            ctx.font = "18px Orbitron";
            ctx.fillText(subText, 50, 90);
        }

        // --- Logic: Step Machine ---

        function toggleAutoPlay() {
            autoPlay = autoplayCheck.checked;
            if (autoPlay && waitingForStep) {
                // If we were waiting, resume immediately
                nextStep();
            }
            // Update UI state
            nextBtn.disabled = autoPlay || !running || !waitingForStep;
        }

        function startScenario(target) {
            if (running) return;
            resetSim(); // clear old state
            running = true;
            disableScenarioBtns(true);

            // Generate Steps based on target
            currentSteps = buildScenarioSteps(target);
            stepIndex = 0;

            // Start first step
            executeNext();
        }

        function nextStep() {
            if (!running || !waitingForStep) return;
            waitingForStep = false;
            nextBtn.disabled = true; // Disable until next wait

            stepIndex++;
            if (stepIndex < currentSteps.length) {
                executeNext();
            } else {
                finishScenario();
            }
        }

        function executeNext() {
            let step = currentSteps[stepIndex];

            // Helper to handle auto-progression
            let onComplete = () => {
                if (step.auto || autoPlay) {
                    setTimeout(() => {
                        stepIndex++;
                        if (stepIndex < currentSteps.length) executeNext();
                        else finishScenario();
                    }, step.delay || 500);
                } else {
                    waitingForStep = true;
                    subText = "PAUSED. Press NEXT STEP to continue...";
                    nextBtn.disabled = false;
                    nextBtn.classList.add('pulse'); // Visual cue
                }
            };

            // Execute the action
            if (step.action) {
                step.action(onComplete);
            }
        }

        function buildScenarioSteps(target) {
            let steps = [];

            // 1. CPU Request
            steps.push({
                action: (done) => {
                    statusText = `SCENARIO: FIND DATA IN ${target}`;
                    subText = "Step 1: CPU requests address...";
                    sendPacket('CPU', 'L1', 0.04, () => {
                        activeNode = 'L1';
                        nodeStatus.L1 = 'SCAN';
                        statusText = "CHECKING L1 CACHE...";
                        // Wait triggers here
                        done();
                    });
                },
                auto: false // WAIT at L1 arrival
            });

            // If L1 is target
            if (target === 'L1') {
                steps.push({
                    action: (done) => {
                        nodeStatus.L1 = 'HIT';
                        statusText = "L1 HIT!";
                        subText = "Data found immediately.";
                        done();
                    }, auto: false
                });
            } else {
                // L1 Miss
                steps.push({
                    action: (done) => {
                        nodeStatus.L1 = 'MISS';
                        statusText = "L1 MISS";
                        subText = "Data not found. Forwarding to L2...";
                        done();
                    }, auto: true // animation flow
                });

                // Move L1 -> L2
                steps.push({
                    action: (done) => {
                        sendPacket('L1', 'L2', 0.03, () => {
                            activeNode = 'L2';
                            nodeStatus.L2 = 'SCAN';
                            statusText = "CHECKING L2 CACHE...";
                            done();
                        });
                    }, auto: false // WAIT at L2 arrival
                });

                if (target === 'L2') {
                    // L2 Hit logic
                    steps.push({
                        action: (done) => {
                            nodeStatus.L2 = 'HIT';
                            statusText = "L2 HIT!";
                            subText = "Found. Copying back to L1...";
                            done();
                        }, auto: false
                    });
                    // Copy Back L2 -> L1
                    steps.push({
                        action: (done) => {
                            sendPacket('L2', 'L1', 0.03, () => {
                                nodeStatus.L1 = 'HIT'; // L1 fills
                                done();
                            }, COLORS.HIT);
                        }, auto: true
                    });

                } else {
                    // L2 Miss
                    steps.push({
                        action: (done) => {
                            nodeStatus.L2 = 'MISS';
                            statusText = "L2 MISS";
                            subText = "Forwarding to L3...";
                            done();
                        }, auto: true
                    });

                    // Move L2 -> L3
                    steps.push({
                        action: (done) => {
                            sendPacket('L2', 'L3', 0.02, () => {
                                activeNode = 'L3';
                                nodeStatus.L3 = 'SCAN';
                                statusText = "CHECKING L3 CACHE...";
                                done();
                            });
                        }, auto: false // WAIT at L3
                    });

                    if (target === 'L3') {
                        // L3 Hit logic
                        steps.push({
                            action: (done) => {
                                nodeStatus.L3 = 'HIT';
                                statusText = "L3 HIT!";
                                subText = "Found. Copying back chain...";
                                done();
                            }, auto: false
                        });
                        // Copy L3 -> L2
                        steps.push({
                            action: (done) => {
                                sendPacket('L3', 'L2', 0.03, () => { nodeStatus.L2 = 'HIT'; done(); }, COLORS.HIT);
                            }, auto: true
                        });
                        // Copy L2 -> L1
                        steps.push({
                            action: (done) => {
                                sendPacket('L2', 'L1', 0.03, () => { nodeStatus.L1 = 'HIT'; done(); }, COLORS.HIT);
                            }, auto: true
                        });

                    } else {
                        // L3 Miss (RAM Target)
                        steps.push({
                            action: (done) => {
                                nodeStatus.L3 = 'MISS';
                                statusText = "L3 MISS";
                                subText = "Must fetch from Main Memory (RAM)...";
                                done();
                            }, auto: true
                        });

                        // Move L3 -> RAM
                        steps.push({
                            action: (done) => {
                                sendPacket('L3', 'RAM', 0.01, () => {
                                    activeNode = 'RAM';
                                    nodeStatus.RAM = 'SCAN';
                                    statusText = "ACCESSING RAM...";
                                    done();
                                });
                            }, auto: false // Wait at RAM
                        });

                        // RAM Hit
                        steps.push({
                            action: (done) => {
                                nodeStatus.RAM = 'HIT';
                                statusText = "RAM ACCESS COMPLETE";
                                subText = "Uploading data relative to bus speed...";
                                done();
                            }, auto: false
                        });

                        // Copy RAM -> L3
                        steps.push({
                            action: (done) => {
                                sendPacket('RAM', 'L3', 0.02, () => { nodeStatus.L3 = 'HIT'; done(); }, COLORS.HIT);
                            }, auto: true
                        });
                        // Copy L3 -> L2
                        steps.push({
                            action: (done) => {
                                sendPacket('L3', 'L2', 0.03, () => { nodeStatus.L2 = 'HIT'; done(); }, COLORS.HIT);
                            }, auto: true
                        });
                        // Copy L2 -> L1
                        steps.push({
                            action: (done) => {
                                sendPacket('L2', 'L1', 0.03, () => { nodeStatus.L1 = 'HIT'; done(); }, COLORS.HIT);
                            }, auto: true
                        });
                    }
                }
            }

            // Final Step (L1 -> CPU) for all cases except immediate fail (optional)
            steps.push({
                action: (done) => {
                    statusText = "RETURNING DATA TO CPU...";
                    sendPacket('L1', 'CPU', 0.05, () => {
                        done();
                    }, COLORS.HIT);
                }, auto: true
            });

            return steps;
        }

        function finishScenario() {
            statusText = "SCENARIO COMPLETE";
            subText = "Select another scenario or Reset";
            running = false;
            activeNode = null;
            waitingForStep = false;
            nextBtn.disabled = true;
            disableScenarioBtns(false);
        }

        function resetSim() {
            running = false;
            waitingForStep = false;
            packets = [];
            particles = [];
            nodeStatus = { L1: 'IDLE', L2: 'IDLE', L3: 'IDLE', RAM: 'IDLE' };
            statusText = "SYSTEM READY";
            subText = "Select a scenario to begin";
            activeNode = null;
            nextBtn.disabled = true;
            disableScenarioBtns(false);
        }

        // --- Utils ---
        function sendPacket(from, to, speed, callback, colorOverride) {
            packets.push({
                startX: NODES[from].x,
                endX: NODES[to].x,
                y: 275,
                progress: 0,
                speed: speed,
                color: colorOverride || "#fff",
                onComplete: callback
            });
        }

        function disableScenarioBtns(disabled) {
            scenarioBtns.forEach(btn => btn.disabled = disabled);
        }

        // --- Recorder ---
        let mediaRecorder;
        let chunks = [];
        let recording = false;

        function toggleRecord() {
            const btn = document.getElementById('rec-btn');
            if (!recording) {
                let stream = canvas.captureStream(60);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                mediaRecorder.onstop = saveVideo;
                mediaRecorder.start();
                recording = true;
                btn.classList.add('recording');
                btn.innerText = "■ STOP";
            } else {
                mediaRecorder.stop();
                recording = false;
                btn.classList.remove('recording');
                btn.innerText = "● REC";
            }
        }

        function saveVideo() {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'phase4_stepper.webm';
            document.body.appendChild(a);
            a.click();
            chunks = [];
        }

        // Keyboard Shortcut for Next
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowRight') {
                if (!nextBtn.disabled) nextStep();
            }
        });

        // Init
        draw();
        loop();

    </script>
</body>

</html>
