<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase 5: Real World Application</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700&display=swap');

        body {
            margin: 0;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Inter', sans-serif;
            color: white;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* --- Desktop UI --- */
        #desktop {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- Windows --- */
        .window {
            position: absolute;
            background: rgba(20, 20, 30, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.1s;
        }

        .title-bar {
            background: #1a1a20;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            color: #aaa;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .window-content {
            flex: 1;
            position: relative;
        }

        .window-controls span {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-left: 6px;
        }

        .close {
            background: #ff5f56;
        }

        .min {
            background: #ffbd2e;
        }

        .max {
            background: #27c93f;
        }

        /* --- Game Window --- */
        #game-window {
            width: 900px;
            height: 550px;
            top: 50px;
            left: 50px;
            z-index: 10;
        }

        /* --- Task Manager --- */
        #task-manager {
            width: 350px;
            height: 400px;
            top: 100px;
            right: 50px;
            z-index: 20;
        }

        /* --- Sim UI Inside Task Manager --- */
        .stat-row {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .stat-val {
            color: #fff;
        }

        .graph-area {
            width: 100%;
            height: 60px;
            background: #111;
            margin-top: 5px;
            border: 1px solid #333;
            position: relative;
        }

        canvas.graph {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* --- Controls Container (Cheats) --- */
        #controls-window {
            width: 300px;
            bottom: 80px;
            right: 50px;
            top: auto;
            /* Override absolute positioning logic if needed */
            z-index: 30;
        }

        .control-panel {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 12px;
            background: #2a2a35;
            border: 1px solid #444;
            color: #eee;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            text-align: left;
        }

        button:hover:not(:disabled) {
            background: #3a3a45;
            border-color: #666;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.primary {
            background: #007aff;
            border-color: #005bb5;
            color: white;
        }

        button.primary:hover {
            background: #0062cc;
        }

        button.danger {
            background: #ff3b30;
            border-color: #d12e25;
            color: white;
        }

        button.danger:hover {
            background: #d63229;
        }

        /* --- Removed HTML Overlays (Now Canvas) -- */

        /* --- Taskbar --- */
        #taskbar {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 50px;
            background: rgba(25, 25, 30, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
        }

        .start-btn {
            width: 30px;
            height: 30px;
            background: #fff;
            mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" fill="black" xmlns="http://www.w3.org/2000/svg"><path d="M3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12Z"/></svg>');
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" fill="black" xmlns="http://www.w3.org/2000/svg"><path d="M3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12Z"/></svg>');
            background-color: #ccc;
        }
    </style>
</head>

<body>

    <div id="desktop">

        <!-- Game Window -->
        <div id="game-window" class="window">
            <div class="title-bar">
                <span>CyberRun 2077.exe</span>
                <div class="window-controls"><span class="min"></span><span class="max"></span><span
                        class="close"></span></div>
            </div>
            <div class="window-content">
                <canvas id="gameCanvas" width="900" height="515"></canvas>
            </div>
        </div>

        <!-- Task Manager Window -->
        <div id="task-manager" class="window">
            <div class="title-bar">
                <span>Task Manager</span>
                <div class="window-controls"><span class="min"></span><span class="max"></span><span
                        class="close"></span></div>
            </div>
            <div class="window-content">
                <div class="stat-row">
                    <div class="stat-label"><span>CPU Usage</span> <span class="stat-val" id="cpu-val">12%</span></div>
                    <div class="graph-area"><canvas id="cpu-graph" width="318" height="60"></canvas></div>
                </div>
                <div class="stat-row">
                    <div class="stat-label"><span>Memory (RAM)</span> <span class="stat-val" id="ram-val">4.2 GB</span>
                    </div>
                    <div class="graph-area"><canvas id="ram-graph" width="318" height="60"></canvas></div>
                </div>
                <div class="stat-row">
                    <div class="stat-label"><span>Disk (SSD)</span> <span class="stat-val" id="disk-val">0%</span></div>
                    <div class="graph-area"><canvas id="disk-graph" width="318" height="60"></canvas></div>
                </div>
            </div>
        </div>

        <!-- Controls / Trainer Window -->
        <div id="controls-window" class="window">
            <div class="title-bar">
                <span>Simulation Controls</span>
                <div class="window-controls"></div>
            </div>
            <div class="window-content control-panel">
                <button class="primary" onclick="startLoading()">1. LOAD GAME (Disk > RAM)</button>
                <div style="border-top:1px solid #444; margin:5px 0;"></div>
                <label style="color:#888; font-size:12px; font-weight:600;">TRIGGER LAG (STEP-THROUGH):</label>
                <button class="danger" onclick="triggerStutter('L2')">SCENARIO: L2 HIT (Fast)</button>
                <button class="danger" onclick="triggerStutter('L3')">SCENARIO: L3 HIT (Medium)</button>
                <button class="danger" onclick="triggerStutter('RAM')">SCENARIO: RAM HIT (Slow)</button>
                <button onclick="resetSim()">RESET SIMULATION</button>
                <button id="rec-btn" onclick="toggleRecord()">● RECORD SCREEN</button>
            </div>
        </div>

        <!-- Taskbar -->
        <div id="taskbar">
            <div class="start-btn"></div>
        </div>

    </div>

    <script>
        // --- Setup ---
        const gameCanvas = document.getElementById('gameCanvas');
        const gameCtx = gameCanvas.getContext('2d');
        // Xray canvas removed, drawing on gameCtx now

        // Graphs
        const cpuGraph = setupGraph('cpu-graph');
        const ramGraph = setupGraph('ram-graph');
        const diskGraph = setupGraph('disk-graph');

        // Logic State
        let gameState = 'MENU'; // MENU, LOADING, PLAYING, STUTTER
        let frameCount = 0;
        let objects = [];

        // Stats
        let cpuUsage = 10;
        let ramUsage = 15; // Percent
        let diskUsage = 0;

        // X-ray State
        let xrayPacket = null;
        let xrayStep = 0;
        let xrayPaused = false;
        let xrayTarget = 'RAM'; // L2, L3, RAM

        // --- Game Loop ---
        function loop() {
            // Update Logic
            if (gameState === 'PLAYING') {
                frameCount++;
                if (frameCount % 60 === 0) spawnObstacle();
                updateObjects();

                // Simulate Stats (Smoothed)
                // Target around 45%, varying slightly
                let target = 45 + (Math.random() - 0.5) * 10;
                cpuUsage += (target - cpuUsage) * 0.1;

                ramUsage = 70; // High steady RAM
                diskUsage = 0; // Low disk
            } else if (gameState === 'LOADING') {
                // Handled in dedicated loader interval
            } else if (gameState === 'STUTTER') {
                cpuUsage += (0 - cpuUsage) * 0.2; // Drop to 0
                diskUsage = 0;
                // RAM usage stays high
            } else {
                // Menu / Idle
                // Target around 5%
                let target = 5 + (Math.random() - 0.5) * 2;
                cpuUsage += (target - cpuUsage) * 0.1;

                ramUsage = 15;
                diskUsage = 0;
            }

            // Update Graphs
            updateGraph(cpuGraph, cpuUsage, '#007aff');
            updateGraph(ramGraph, ramUsage, '#ac39ff');
            updateGraph(diskGraph, diskUsage, '#27c93f');

            // Update DOM text
            document.getElementById('cpu-val').innerText = Math.round(cpuUsage) + "%";
            document.getElementById('ram-val').innerText = Math.round((ramUsage / 100) * 16).toFixed(1) + " GB";
            document.getElementById('disk-val').innerText = Math.round(diskUsage) + "%";

            // Draw Game (only if playing or stuttering, so we see the freeze)
            if (gameState === 'PLAYING' || gameState === 'STUTTER') {
                drawGame();
            } else if (gameState === 'MENU') {
                gameCtx.fillStyle = '#000';
                gameCtx.fillRect(0, 0, 900, 515);
                gameCtx.fillStyle = '#fff';
                gameCtx.font = "30px Orbitron";
                gameCtx.textAlign = "center";
                gameCtx.fillText("READY TO PLAY", 450, 250);
                gameCtx.font = "14px Inter";
                gameCtx.fillStyle = '#888';
                gameCtx.fillText("Press 'LOAD GAME' to initialize memory", 450, 280);
            }

            // Draw Overlays (Draw ON TOP)
            if (gameState === 'LOADING') {
                drawLoadingOverlay();
            } else if (gameState === 'STUTTER') {
                drawStutterOverlay();
            }

            requestAnimationFrame(loop);
        }

        // --- Game Logic ---
        function spawnObstacle() {
            objects.push({ x: 900, y: 300 + Math.random() * 100, w: 50, h: 50, type: 'CUBE' });
        }

        function updateObjects() {
            objects.forEach(o => o.x -= 10); // Fast scroll
            objects = objects.filter(o => o.x > -100);
        }

        function drawGame() {
            // Cyberpunk Grid Background
            gameCtx.fillStyle = '#050510';
            gameCtx.fillRect(0, 0, 900, 515);

            // Grid Lines
            gameCtx.strokeStyle = '#202040';
            gameCtx.lineWidth = 2;
            let offset = (frameCount * 10) % 100;
            gameCtx.beginPath();
            // Vertical moving lines
            for (let x = -offset; x < 900; x += 100) { gameCtx.moveTo(x, 250); gameCtx.lineTo(x - 200, 515); }
            // Horizon
            gameCtx.moveTo(0, 250); gameCtx.lineTo(900, 250);
            gameCtx.stroke();

            // Sun
            gameCtx.fillStyle = '#ff0055';
            gameCtx.beginPath();
            gameCtx.arc(450, 180, 80, 0, Math.PI * 2);
            gameCtx.fill();
            gameCtx.shadowBlur = 40;
            gameCtx.shadowColor = '#ff0055';
            gameCtx.fill();
            gameCtx.shadowBlur = 0;

            // Objects
            gameCtx.fillStyle = '#00ffcc';
            objects.forEach(o => {
                gameCtx.shadowBlur = 20;
                gameCtx.shadowColor = '#00ffcc';
                gameCtx.fillRect(o.x, o.y, o.w, o.h);
                gameCtx.shadowBlur = 0;
            });
        }


        // --- Scenarios ---

        let loadProgress = 0;

        function startLoading() {
            if (gameState === 'LOADING') return;
            gameState = 'LOADING';
            loadProgress = 0;

            let interval = setInterval(() => {
                loadProgress += 1;
                // Removed DOM Updates

                // Sim Loading Stats
                // Smooth Disk usage (High)
                let targetDisk = 90 + (Math.random() - 0.5) * 5;
                diskUsage += (targetDisk - diskUsage) * 0.1;

                ramUsage = 15 + (loadProgress * 0.55); // RAM filling up to 70%

                // CPU waiting (Low)
                let targetCpu = 15 + (Math.random() - 0.5) * 2;
                cpuUsage += (targetCpu - cpuUsage) * 0.1;

                if (loadProgress >= 100) {
                    clearInterval(interval);
                    gameState = 'PLAYING';
                    diskUsage = 0;
                }
            }, 50); // 5 sec load time
        }

        function drawLoadingOverlay() {
            // Draw Black Overlay
            gameCtx.fillStyle = '#000000';
            gameCtx.fillRect(0, 0, 900, 515);

            // Draw Text
            gameCtx.fillStyle = '#fff';
            gameCtx.font = "30px Orbitron";
            gameCtx.textAlign = "center";
            gameCtx.fillText("LOADING LEVEL...", 450, 230);

            gameCtx.font = "14px Inter";
            gameCtx.fillStyle = '#666';
            gameCtx.fillText("Transferring Assets: Disk > RAM", 450, 300);

            // Draw Bar
            gameCtx.fillStyle = '#333';
            gameCtx.fillRect(300, 250, 300, 4); // bg

            gameCtx.fillStyle = '#fff';
            gameCtx.fillRect(300, 250, 300 * (loadProgress / 100), 4); // fill
        }

        function triggerStutter(target) {
            if (gameState !== 'PLAYING') return;
            gameState = 'STUTTER';
            xrayTarget = target;

            // Removed DOM logic

            // Init Step Mode
            xrayStep = 0;
            xrayPaused = true;
            xrayPacket = { x: 50, y: 100, label: 'REQ', color: '#fff' }; // Start at CPU
            xrayStatusText = `PAUSED. Scenario: ${target} Hit. Press Space.`;
        }

        function nextXrayStep() {
            if (gameState !== 'STUTTER') return;

            // Direct Exit if Done
            if (xrayStep >= 99) {
                gameState = 'PLAYING';
                return;
            }

            if (!xrayPaused) return;
            xrayStep++;
            xrayPaused = false;
        }

        // --- X-Ray Animation (The Lesson) ---

        let xrayStatusText = "";

        function drawStutterOverlay() {
            // Draw Dim Overlay
            gameCtx.fillStyle = 'rgba(0, 10, 20, 0.85)';
            gameCtx.fillRect(0, 0, 900, 515);

            // Draw "Window" for Xray
            // Centered at 450, 257. Size 600x200
            let ox = 150; // offset x
            let oy = 157; // offset y

            gameCtx.fillStyle = '#050505';
            gameCtx.strokeStyle = '#00ff88';
            gameCtx.lineWidth = 2;
            gameCtx.shadowBlur = 30;
            gameCtx.shadowColor = 'rgba(0,255,136, 0.2)';
            gameCtx.fillRect(ox, oy, 600, 200);
            gameCtx.strokeRect(ox, oy, 600, 200);
            gameCtx.shadowBlur = 0;

            // Title
            gameCtx.font = "30px Orbitron";
            gameCtx.fillStyle = '#ff3b30';
            gameCtx.shadowBlur = 10;
            gameCtx.shadowColor = 'red';
            gameCtx.fillText("⚠️ CACHE MISS DETECTED ⚠️", 450, 100);
            gameCtx.shadowBlur = 0;

            gameCtx.font = "16px Inter";
            gameCtx.fillStyle = '#aaa';
            gameCtx.fillText("CPU is Stalled. Waiting for data...", 450, 130);

            // Update Logic
            updateXrayLogic();

            // Draw System (Nodes & Bus) relative to ox, oy
            drawXrayStatic(ox, oy);

            // Draw Packet
            if (xrayPacket) {
                drawPacket(ox + xrayPacket.x, oy + xrayPacket.y, xrayPacket.color);
            }

            // Draw Status Text
            gameCtx.font = "14px monospace";
            gameCtx.fillStyle = '#00ff88';
            gameCtx.fillText(xrayStatusText, 450, oy + 230);

            // Draw "Next Button" Hint
            gameCtx.fillStyle = '#00ff88';
            gameCtx.fillRect(380, oy + 250, 140, 40);
            gameCtx.fillStyle = '#000';
            gameCtx.font = "bold 14px Inter";
            gameCtx.fillText("▶ NEXT STEP (Space)", 450, oy + 275);
        }

        function updateXrayLogic() {
            if (!xrayPacket) return;

            if (xrayPaused) {
                return;
            }

            // --- ANIMATION STEP MACHINE ---
            // Layout X: CPU=50, L1=150, L2=250, L3=350, RAM=500

            // Step 1: CPU Check L1 (Always Miss for Stutter)
            if (xrayStep === 1) {
                xrayStatusText = "Step 1: Checking L1 Cache... (MISS)";
                xrayPacket.x = 150; // Jump to L1
                xrayPacket.color = '#ff3b30'; // Red for miss
                xrayPaused = true;
            }
            // Step 2: L1 -> L2
            else if (xrayStep === 2) {
                if (xrayPacket.x < 250) {
                    xrayPacket.x += 2;
                    xrayStatusText = "Step 2: L1 Miss. Checking L2 Cache...";
                } else {
                    xrayPacket.x = 250;
                    if (xrayTarget === 'L2') {
                        xrayStatusText = "FOUND in L2! (HIT)";
                        xrayPacket.color = '#00ff88'; // Green Hit
                        xrayPacket.label = 'DATA';
                        // Skip to Return
                        xrayStep = 10; // Go to return sequence
                        xrayPaused = true;
                    } else {
                        xrayStatusText = "L2 Cache Miss. Press Space.";
                        xrayPacket.color = '#ff3b30';
                        xrayPaused = true;
                    }
                }
            }
            // Step 3: L2 -> L3
            else if (xrayStep === 3) {
                if (xrayPacket.x < 350) {
                    xrayPacket.x += 2;
                    xrayStatusText = "Step 3: Checking L3 Cache...";
                } else {
                    xrayPacket.x = 350;
                    if (xrayTarget === 'L3') {
                        xrayStatusText = "FOUND in L3! (HIT)";
                        xrayPacket.color = '#00ff88';
                        xrayPacket.label = 'DATA';
                        xrayStep = 10;
                        xrayPaused = true;
                    } else {
                        xrayStatusText = "L3 Cache Miss. Press Space.";
                        xrayPacket.color = '#ff3b30';
                        xrayPaused = true;
                    }
                }
            }
            // Step 4: L3 -> RAM
            else if (xrayStep === 4) {
                if (xrayPacket.x < 500) {
                    xrayPacket.x += 1; // Slow to RAM
                    xrayStatusText = "Step 4: Fetching from Main Memory (RAM)...";
                } else {
                    xrayPacket.x = 500;
                    xrayStatusText = "FOUND in RAM. Press Space to Return.";
                    xrayPacket.color = '#00ff88';
                    xrayPacket.label = 'DATA';
                    xrayPaused = true;
                }
            }
            // Step 5: RAM Return -> L3 (Start Return Journey for RAM Hit)
            else if (xrayStep === 5) {
                if (xrayPacket.x > 350) {
                    xrayPacket.x -= 0.5; // Very Slow Return
                    xrayStatusText = "Return Step: Traveling System Bus... (Slow)";
                } else {
                    xrayPacket.x = 350;
                    xrayStatusText = "Data filled to L3. Press Space.";
                    xrayPaused = true;
                }
            }
            // Step 6: L3 -> L2 (Generic Return Step)
            else if (xrayStep === 6 || xrayStep === 11) {
                if (xrayPacket.x > 50) {
                    xrayPacket.x -= 2; // Fast return inside chip
                    xrayStatusText = "Filling Cache Hierarchy -> CPU...";
                } else {
                    xrayPacket.x = 50;
                    xrayStatusText = "Data Arrived! Frame Ready. Press Space.";
                    xrayPaused = true;
                    xrayStep = 99; // Done state
                }
            }
            // Return handling for L2/L3 Hits (Jumps)
            else if (xrayStep === 10) {
                xrayStep = 6; // Join the main return path
            }
            // Final
            else if (xrayStep === 100) {
                gameState = 'PLAYING';
            }

            // Auto finish after return
            if (xrayStep === 99 && xrayPacket.x <= 50) {
                xrayPaused = true;
            }
        }

        function drawXrayStatic(ox, oy) {
            // Nodes
            drawXrayNode(ox + 50, "CPU", '#fff');
            drawXrayNode(ox + 150, "L1", '#00ffff');
            drawXrayNode(ox + 250, "L2", '#ffee00');
            drawXrayNode(ox + 350, "L3", '#ffaa00');
            drawXrayNode(ox + 500, "RAM", '#ff0044');

            // Bus Lines
            gameCtx.strokeStyle = '#333';
            gameCtx.lineWidth = 4;
            gameCtx.beginPath();
            gameCtx.moveTo(ox + 70, oy + 100); gameCtx.lineTo(ox + 480, oy + 100);
            gameCtx.stroke();
        }

        function drawPacket(x, y, color) {
            gameCtx.fillStyle = color;
            gameCtx.shadowBlur = 10;
            gameCtx.shadowColor = color;
            gameCtx.fillRect(x - 10, y - 10, 20, 20);
            gameCtx.shadowBlur = 0;
        }

        function drawXrayNode(x, label, color) {
            gameCtx.strokeStyle = color;
            gameCtx.fillStyle = '#111';
            gameCtx.lineWidth = 2;
            gameCtx.strokeRect(x - 20, 157 + 80, 40, 40); // y relative to oy=157 + 80 = 237
            gameCtx.fillRect(x - 20, 237, 40, 40);

            gameCtx.fillStyle = color;
            gameCtx.textAlign = 'center';
            gameCtx.font = "12px Orbitron";
            gameCtx.fillText(label, x, 227);
        }

        function resetSim() {
            gameState = 'MENU';
            objects = [];
            cpuUsage = 10;
            ramUsage = 15;
            diskUsage = 0;
        }

        // --- Graph Helpers ---
        function setupGraph(id) {
            const canvas = document.getElementById(id);
            return {
                ctx: canvas.getContext('2d'),
                width: canvas.width,
                height: canvas.height,
                data: new Array(100).fill(0)
            };
        }

        function updateGraph(graph, value, color) {
            graph.data.shift();
            graph.data.push(value);

            graph.ctx.clearRect(0, 0, graph.width, graph.height);
            graph.ctx.beginPath();
            graph.ctx.strokeStyle = color;
            graph.ctx.lineWidth = 2;

            for (let i = 0; i < graph.data.length; i++) {
                let x = (i / graph.data.length) * graph.width;
                let h = (graph.data[i] / 100) * graph.height;
                let y = graph.height - h;
                if (i === 0) graph.ctx.moveTo(x, y);
                else graph.ctx.lineTo(x, y);
            }
            graph.ctx.stroke();

            // Fill
            graph.ctx.lineTo(graph.width, graph.height);
            graph.ctx.lineTo(0, graph.height);
            graph.ctx.fillStyle = color + "33"; // Transparent hex
            graph.ctx.fill();
        }

        // --- Recorder ---
        let mediaRecorder;
        let chunks = [];
        let recording = false;

        // Helper to record entire Desktop div logic is hard without standard canvas.captureStream on DIVs.
        // We will rely on user screen recording OR we can capture the Game Canvas specifically.
        // Requested: "Visual: Screen recording of a heavy application".
        // LIMITATION: HTML Canvas recorder only records 1 canvas.
        // WORKAROUND: We will record the main GAME canvas since that's where the action is, 
        // OR we warn user.
        // Since we have multiple canvases (Game, CPU, RAM, Disk), combining them is complex.
        // I will bind the Record button to the *Game Layout* if possible, 
        // but cleaner is just to record the game canvas as that's the "Visual".

        function toggleRecord() {
            // Note: This only records the GAME WINDOW content, not the full desktop chrome.
            // This is a browser limitation (security) regarding full tab capture without extension.
            const btn = document.getElementById('rec-btn');
            if (!recording) {
                let stream = gameCanvas.captureStream(60);
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
                mediaRecorder.onstop = saveVideo;
                mediaRecorder.start();
                recording = true;
                btn.style.color = "red";
                btn.innerText = "■ STOP RECORDING (GAME ONLY)";
            } else {
                mediaRecorder.stop();
                recording = false;
                btn.style.color = "white";
                btn.innerText = "● RECORD SCREEN";
            }
        }

        function saveVideo() {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'phase5_real_world.webm';
            document.body.appendChild(a);
            a.click();
            chunks = [];
        }

        // Keyboard Shortcut for Step
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && gameState === 'STUTTER') {
                e.preventDefault();
                nextXrayStep();
            }
        });

        loop(); // Start
    </script>
</body>

</html>
